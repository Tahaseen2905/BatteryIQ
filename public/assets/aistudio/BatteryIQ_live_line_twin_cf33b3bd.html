<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BatteryIQ live line twin</title>
<style>
:root {
  --bg: #111925;
  --card: #1f2937;
  --tx: #f1efe8;
  --tx2: #b4b2a9;
  --bd: #374151;
  --ac: #10b981;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  user-select: none;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(#27384f, #111925);
  touch-action: none;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#lab {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.chip {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: auto;
  cursor: pointer;
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(255, 255, 255, 0.95);
  color: #1f2937;
  border-radius: 8px;
  padding: 3px 8px;
  font: 11.5px/1.3 ui-monospace, Menlo, Consolas, monospace;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  will-change: transform;
  border: 1px solid rgba(0, 0, 0, 0.1);
  transition: transform 0.15s ease, outline 0.15s ease;
}
.chip:hover {
  transform: translate(-50%, -100%) scale(1.05);
}
.chip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.chip .t {
  font-weight: 700;
  color: #111827;
}
.chip .v {
  color: #4b5563;
  font-weight: 500;
}
.chip .v.s {
  color: #d92d20;
  font-weight: 700;
}
.chip.sel {
  outline: 2.5px solid #10b981;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
  z-index: 10;
}
.zone {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  color: rgba(205, 218, 238, 0.55);
  font: italic 12px system-ui, -apple-system, sans-serif;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
#lab.far .chip .v{display:none}
#lab.far .zone{display:none}
</style>
</head>

  s.scale.set(2.4, 1.2, 1);

  g.add(s);
}

function gate(g, s, k) {

  B(g, 0.35, 0.35, 0.35, 0, 4.1, 0, c);
}

// Machine status rings and floating chips
const SC = { ok: '#1d9e75', warn: '#ef9f27', stop: '#e24b4a' };
const hc = h => h >= 85 ? '#1d9e75' : h >= 65 ? '#ef9f27' : '#e24b4a';
const ring = [], chips = [];
let mode = 'r';

D.forEach((s, i) => {
  cur = i;
  const g = new THREE.Group();
  g.position.set(s.x, 0, s.z);
  if (window.P && P.models && P.models[s.id]) {
    const a0 = P.anim.length, l0 = P.lamps.length;
    P.models[s.id](g);
    s.a = [a0, P.anim.length];
    s.l = [l0, P.lamps.length];
    g.traverse(o => {
      if (o.isSprite) o.visible = false;
      if (o.isMesh) { o.userData.i = i; PICK.push(o); }
    });
  } else s.b(g);
  S.add(g);
  if (s.a) s.h = new THREE.Box3().setFromObject(g).max.y + 0.4;
  cur = -1;

  const r = new THREE.Mesh(new THREE.RingGeometry(4.5, 4.85, 48), new THREE.MeshBasicMaterial({ color: SC[s.s], side: 2 }));
  r.rotation.x = -Math.PI / 2;
  r.position.set(s.x, 0.14, s.z);
  r.scale.set(s.rs * (i == 1 ? 1.55 : 1), s.rs * (i == 1 ? 0.8 : 1), 1);
  S.add(r);
  ring.push(r);

  const c = document.createElement('div');
  c.className = 'chip';
  c.innerHTML = '<i></i><span class="t">' + s.id + '</span><span class="v"></span>';
  c.onclick = () => sel(i);
  lab.appendChild(c);
  chips.push(c);
});

const zs = ZN.map(z => {
  const e = document.createElement('div');
  e.className = 'zone';
  e.textContent = z[0];
  lab.appendChild(e);
  return [e, z[1], z[2]];
});

// Flowing battery materials along conveyors
const N = 60;
const IMs = [
  [new THREE.CylinderGeometry(0.55, 0.55, 1.3, 16).rotateZ(Math.PI / 2), 0xffffff],
  [new THREE.CylinderGeometry(0.34, 0.34, 1, 14), 0xffffff],
  [new THREE.BoxGeometry(1.7, 1.1, 1.2), 0x20242b],
  [new THREE.BoxGeometry(1.72, 0.3, 1.22), 0xd22630],
  [new THREE.CylinderGeometry(0.14, 0.14, 0.2, 10), 0xc9ced6]
].map(a => {
  const m = new THREE.InstancedMesh(a[0], new THREE.MeshStandardMaterial({ color: a[1], roughness: 0.5, metalness: 0.2 }), 2 * N);
  m.count = 0;
  m.frustumCulled = false;
  S.add(m);
  return m;
});

const PT = [[-31, -10], [23, -10], [23, 4], [-45, 4]].map(p => V3(p[0], 0.7, p[1]));
let LN = [0], TOT = 0;
for (let i = 0; i < 3; i++) {
  TOT += PT[i].distanceTo(PT[i + 1]);
  LN.push(TOT);
}

const stops = [[0, 0x9aa3ad], [0.3, 0x8a929d], [0.55, 0x7d8794], [0.8, 0x6f7885], [1, 0x6f7885]];
const dm = new THREE.Object3D(), pc = new THREE.Color(), c2 = new THREE.Color(), p3 = V3(0, 0, 0);

function grad(u) {
  for (let i = 1; i < 5; i++) {
    if (u <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      return pc.set(a[1]).lerp(c2.set(b[1]), (u - a[0]) / (b[0] - a[0]));
    }
  }
  return pc.set(0x6f7885);
}

function flow(t) {
  const n = [0, 0, 0];
  for (let k = 0; k < N; k++) {
    const u = (k / N + t * 0.028) % 1, d = u * TOT;
    let i = 0;
    while (i < 2 && d > LN[i + 1]) i++;
    p3.lerpVectors(PT[i], PT[i + 1], (d - LN[i]) / (LN[i + 1] - LN[i]));
    dm.rotation.set(0, i == 1 ? 1.5708 : 0, 0);
    const c = u < 0.54 ? 0 : u < 0.89 ? 1 : 2;

    if (c < 2) {
      dm.position.set(p3.x, c ? 0.8 : 0.95, p3.z);
      dm.updateMatrix();
      IMs[c].setMatrixAt(n[c], dm.matrix);
      IMs[c].setColorAt(n[c]++, grad(u));
    } else {
      const b = n[2]++, ox = i == 1 ? 0 : 0.55, oz = i == 1 ? 0.55 : 0;
      dm.position.set(p3.x, 0.85, p3.z);
      dm.updateMatrix();
      IMs[2].setMatrixAt(b, dm.matrix);
      dm.position.y = 1.2;
      dm.updateMatrix();
      IMs[3].setMatrixAt(b, dm.matrix);
      dm.position.set(p3.x + ox, 1.5, p3.z + oz);
      dm.updateMatrix();
      IMs[4].setMatrixAt(2 * b, dm.matrix);
      dm.position.set(p3.x - ox, 1.5, p3.z - oz);
      dm.updateMatrix();
      IMs[4].setMatrixAt(2 * b + 1, dm.matrix);
    }
  }
  IMs[0].count = n[0];
  IMs[1].count = n[1];
  IMs[2].count = n[2];
  IMs[3].count = n[2];
  IMs[4].count = 2 * n[2];
  IMs.forEach(m => {
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
  });
}

let W = 1, H = 1, tw = null, tm = 0, lt = 0, sI = -1, vis = true;
const kk = () => Math.max(1, 1.6 / cam.aspect);
const val = (i, k) => {
  const t = D[i].t[k];
  return (t[1] + t[2] * Math.sin(tm * 0.9 + i * 1.7 + k * 2.1)).toFixed(t[4]);
};

function vals() {
  D.forEach((s, i) => {
    const c = chips[i];
    if (!c) return;
    const v = c.children[2], d = c.children[0];
    if (mode == 'r') {
      const st = s.s == 'stop';
      v.textContent = st ? 'Stopped' : val(i, 0) + ' ' + s.t[0][3];
      v.className = 'v' + (st ? ' s' : '');
      d.style.cssText = st ? 'background:#fff;border:2px solid #e24b4a' : 'background:' + SC[s.s];
    } else {
      v.textContent = s.hp + '%' + (s.rul ? ' · ' + s.rul : '');
      v.className = 'v';
      d.style.cssText = 'background:' + hc(s.hp);
    }
  });
}

// Machine animation: each detailed model runs only while its station is not stopped
let ptm = 0;
function animate(t) {
  const dt = Math.min(t - ptm, 0.05);
  ptm = t;
  P.t = t;
  D.forEach(s => {
    if (!s.a) return;
    P.running = s.s != 'stop';
    for (let k = s.a[0]; k < s.a[1]; k++) P.anim[k](t, dt);
  });
}

function setLamps(s) {
  if (!s.l) return;
  for (let k = s.l[0]; k < s.l[1]; k++) {
    const m = P.lamps[k], on = s.s == 'stop' ? m.userData.i === 0 : s.s == 'warn' ? m.userData.i === 1 : m.userData.i === 2;
    m.emissiveIntensity = on ? 1.6 : 0.08;
  }
}

// Called by the app with the live status of each machine: { 'HS-01': 'warn', ... }
function setStatuses(map) {
  D.forEach((s, i) => {
    const v = map[s.id];
    if (!v) return;
    s.s = v;
    setLamps(s);
  });
  setMode(mode);
}

function setMode(m) {
  mode = m;
  ring.forEach((r, i) => r.material.color.set(m == 'r' ? SC[D[i].s] : hc(D[i].hp)));
  vals();
}

function foc(i) {
  const s = D[i], k = kk();
  tw = { p: V3(s.x + 5 * k, (s.h + 6) * k, s.z + 15 * k), t: V3(s.x, 3, s.z) };
}

function mark(i) {
  sI = i;
  chips.forEach((c, j) => c.classList.toggle('sel', j == i));
}

// Global selection handler called by click on chips or raycaster
function sel(i) {
  OC.autoRotate = false;
  foc(i);
  mark(i);
  if (D[i]) {
    try {
      window.parent.postMessage({ type: 'MACHINE_CLICKED', id: D[i].id, index: i }, '*');
    } catch (e) {}
  }
}

// Overview camera: far enough that the whole plant fits the width of the frame
function ovp() {
  const d = Math.min(96, Math.max(44, 52 / (0.364 * cam.aspect)));
  return V3(-9, 0.754 * d, 0.657 * d);
}

function rv() {
  const k = kk();
  tw = { p: ovp(), t: V3(-9, 0, 0) };
  mark(-1);
}

function spin() {
  OC.autoRotate = !OC.autoRotate;
  tw = null;
}

function inj() {
  if (D[15]) {
    D[15].s = D[15].s == 'ok' ? 'warn' : 'ok';
    D[15].hp = D[15].s == 'ok' ? 95 : 64;
    setMode(mode);
  }
}

// Raycaster picking for 3D model clicks
const RY = new THREE.Raycaster(), M2 = new THREE.Vector2();
let dn = null;
const cv = $('#cv');

cv.addEventListener('pointerdown', e => dn = [e.clientX, e.clientY]);
cv.addEventListener('pointerup', e => {
  if (!dn || Math.hypot(e.clientX - dn[0], e.clientY - dn[1]) > 5) return;
  const r = cv.getBoundingClientRect();
  M2.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  RY.setFromCamera(M2, cam);
  const h = RY.intersectObjects(PICK, false)[0];
  if (h) sel(h.object.userData.i);
});

const pj = V3(0, 0, 0);
function place(el, x, y, z) {
  pj.set(x, y, z).project(cam);
  el.style.display = pj.z < 1 ? '' : 'none';
  el.style.transform = 'translate(' + ((pj.x * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((-pj.y * 0.5 + 0.5) * H).toFixed(1) + 'px) translate(-50%,-100%)';
}

new ResizeObserver(() => {
  W = stg.clientWidth;
  H = stg.clientHeight;
  R.setSize(W, H, false);
  cam.aspect = W / H;
  cam.updateProjectionMatrix();
}).observe(stg);

new IntersectionObserver(e => vis = e[0].isIntersecting).observe(stg);
W = stg.clientWidth;
H = stg.clientHeight;
R.setSize(W, H, false);
cam.aspect = W / H;
cam.updateProjectionMatrix();
cam.position.copy(ovp());
OC.target.set(-9, 0, 0);

const clk = new THREE.Clock();
setMode('r');
D.forEach(setLamps);

(function loop() {
  requestAnimationFrame(loop);
  if (!vis || document.hidden) {
    clk.getDelta();
    return;
  }
  tm += Math.min(clk.getDelta(), 0.05);
  if (tw) {
    cam.position.lerp(tw.p, 0.05);
    OC.target.lerp(tw.t, 0.07);
  }
  OC.update();
  lab.classList.toggle('far', cam.position.distanceTo(OC.target) > 40);
  animate(tm); // the detailed models carry their own moving batteries; the old generic flow layer is off
  D.forEach((s, i) => place(chips[i], s.x, s.h, s.z));
  zs.forEach(z => place(z[0], z[1], 0.2, z[2]));
  if (tm - lt > 0.7) {
    lt = tm;
    vals();
  }
  R.render(S, cam);
})();
</script>
</body>
</html>
