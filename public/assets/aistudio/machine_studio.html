<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BatteryIQ machine studio</title>
<style>
:root {
  --bg: #111925;
  --card: #1f2937;
  --tx: #f1efe8;
  --tx2: #b4b2a9;
  --bd: #374151;
  --ac: #10b981;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  user-select: none;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(#27384f, #111925);
  touch-action: none;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#lab {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.chip {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: auto;
  cursor: pointer;
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(255, 255, 255, 0.95);
  color: #1f2937;
  border-radius: 8px;
  padding: 3px 8px;
  font: 11.5px/1.3 ui-monospace, Menlo, Consolas, monospace;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  will-change: transform;
  border: 1px solid rgba(0, 0, 0, 0.1);
  transition: transform 0.15s ease, outline 0.15s ease;
}
.chip:hover {
  transform: translate(-50%, -100%) scale(1.05);
}
.chip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.chip .t {
  font-weight: 700;
  color: #111827;
}
.chip .v {
  color: #4b5563;
  font-weight: 500;
}
.chip .v.s {
  color: #d92d20;
  font-weight: 700;
}
.chip.sel {
  outline: 2.5px solid #10b981;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
  z-index: 10;
}
.zone {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  color: rgba(205, 218, 238, 0.55);
  font: italic 12px system-ui, -apple-system, sans-serif;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
</style>
</head>

const xm = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.75 });
grp.traverse(o => { if (o.isMesh) o.userData.m0 = o.material; });
const core3 = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 14), new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.9 }));
core3.position.copy(ctr); core3.visible = false; S.add(core3);
let xray = false, status = 'ok', showTags = true, showPower = true;
function setX(on) { xray = on; grp.traverse(o => { if (o.isMesh && o.userData.m0) o.material = on ? xm : o.userData.m0; }); core3.visible = on; }

P.setLamps('ok');
const fill = new THREE.PointLight(0x9fc4ff, 0.6, 60); fill.position.set(ctr.x - 10, 9, ctr.z + 8); S.add(fill);
const R0 = Math.max(sz.x, sz.y, sz.z);
cam.position.set(ctr.x + R0 * 0.8, ctr.y + R0 * 0.6 + 1.4, ctr.z + R0 * 1.0);
OC.target.copy(ctr);
OC.maxDistance = R0 * 7;

let W = 1, H = 1;
const pj = V3(0, 0, 0);
function place(el, v) {
  pj.copy(v).project(cam);
  el.style.display = pj.z < 1 ? '' : 'none';
  el.style.transform = 'translate(' + ((pj.x * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((-pj.y * 0.5 + 0.5) * H).toFixed(1) + 'px) translate(-50%,-100%)';
}
new ResizeObserver(() => { W = stg.clientWidth; H = stg.clientHeight; R.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix(); }).observe(stg);
W = stg.clientWidth; H = stg.clientHeight; R.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix();

// floating readings: sensor tags on the front, power tags round the back
const chips = [];
const DOT = { ok: '#1d9e75', near: '#ef9f27', out: '#e24b4a' };
function build(list, kind) {
  chips.filter(c => c.kind === kind).forEach(c => { c.el.remove(); chips.splice(chips.indexOf(c), 1); });
  const n = list.length, r = rad * 0.72 + 1.0;
  list.forEach((t, i) => {
    const a = kind === 'tag' ? (-1.15 + (n < 2 ? 1.15 : (i * 2.3) / (n - 1))) : (Math.PI + 0.9 - (n < 2 ? 0.9 : (i * 1.8) / (n - 1)));
    const lvl = kind === 'tag' ? 0.1 + 0.8 * ((i * 0.618) % 1) : 0.25 + 0.4 * (i % 2);
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = '<i></i><span class="t"></span><span class="v"></span>';
    lab.appendChild(el);
    chips.push({ el, kind, anchor: V3(ctr.x + r * Math.sin(a), bb.min.y + sz.y * lvl + 0.8, ctr.z + r * Math.cos(a)) });
    paint(chips[chips.length - 1], t);
  });
}
function paint(c, t) {
  c.el.children[0].style.background = c.kind === 'pwr' ? '#7a6ad8' : DOT[t.state] || DOT.ok;
  c.el.children[1].textContent = t.name;
  c.el.children[2].textContent = t.value;
  c.el.children[2].className = 'v' + (t.state === 'out' ? ' s' : '');
}
function setList(list, kind) {
  const mine = chips.filter(c => c.kind === kind);
  if (mine.length !== list.length) build(list, kind); else mine.forEach((c, i) => paint(c, list[i]));
}
setList((sd.t || []).map(t => ({ name: t[0], value: t[1].toFixed(t[4]) + ' ' + t[3], state: 'ok' })), 'tag');

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'STUDIO') return;
  if ('xray' in d) setX(!!d.xray);
  if ('showTags' in d) showTags = !!d.showTags;
  if ('showPower' in d) showPower = !!d.showPower;
  if (d.tags) setList(d.tags, 'tag');
  if (d.power) setList(d.power, 'pwr');
  if (d.status) {
    status = d.status;
    P.running = d.status !== 'stopped';
    P.setLamps(d.status);
    const c = d.status === 'stopped' ? SCOL.stop : d.status === 'attention' ? SCOL.warn : SCOL.ok;
    ringM.material.color.set(c); lamp.material.color.set(c);
  }
  if ('rotate' in d) OC.autoRotate = !!d.rotate;
});

const clk = new THREE.Clock();
let tm = 0;
(function loop() {
  requestAnimationFrame(loop);
  const dtm = Math.min(clk.getDelta(), 0.05);
  tm += dtm;
  P.update(tm, dtm);
  OC.update();
  if (status !== 'ok') ringM.material.opacity = 0.55 + 0.45 * Math.abs(Math.sin(tm * 3)); else ringM.material.opacity = 1;
  if (xray) core3.position.y = ctr.y + Math.sin(tm * 2.2) * sz.y * 0.28;
  chips.forEach(c => { c.el.style.visibility = (c.kind === 'tag' ? showTags : showPower) ? '' : 'hidden'; place(c.el, c.anchor); });
  R.render(S, cam);
})();
try { parent.postMessage({ type: 'STUDIO_READY', id: sd.id }, '*'); } catch (e) {}
</script>
</body>
</html>
